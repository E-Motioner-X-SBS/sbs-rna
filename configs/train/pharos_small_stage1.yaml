# Stage 1: MLM pretraining. Staged budget -- stop when metrics flatten.
stage: 1_mlm_pretraining
# REVISED cycle 3 (D2/REV-3): 323B on 61M active = 5,295 tok/param = 265x
# Chinchilla, the QiD worst case per arXiv 2411.17691. 25B gives 410 tok/param
# (~20x Chinchilla) -- still deliberately over-trained, without the degradation.
tokens_total: 25e9
expected_stop: 25e9
checkpoints_at: [5e9, 25e9]
ceiling_if_metrics_still_improving: 100e9

optimizer:
  name: muon                # 2D matrices only
  fallback: adamw           # embeddings, norms, router
  # ~2x compute efficiency REPORTED (Moonlight 3B/16B, 5.7T tokens, ~52% FLOPs).
  # NOT benchmarked on our shapes -- must be measured before the factor is claimed.

precision:                  # D3/REV-5
  default: bf16             # train here; precision is NOT the constraint
  fp8: {enabled: false, requires: hopper, adopt_after: baseline_reproduced}
  nvfp4:
    enabled: false
    requires: blackwell
    decision: DO_NOT_ADOPT_AT_THIS_SIZE
    reason: >
      The NVFP4 pretraining recipe was validated at 8B params / 1T tokens
      ~= 125 tok/param. PHAROS-Small is 5,295 tok/param. The "no measurable
      accuracy loss" result does not transfer to this regime.
  nf4:
    enabled: false
    decision: NEVER
    reason: >
      W4A16 with a FROZEN 4-bit base; gradients reach only LoRA adapters.
      It is a finetuning/inference format and cannot train from scratch.
  qat:
    enabled: false          # D4 -- deployment technique, not a training one
    if_4bit_inference_needed: use_QAT_not_PTQ_and_measure_QiD_at_our_size
  keep_high_precision: [embeddings, norms, router, attention_softmax]

corpus_weighting:
  down_weight_151nt_reads: true    # 9/20 chunks median exactly 151 nt; 16.2% of mass
  long_context_sources: [chunk_006, chunk_009]   # median 2,193-2,389 nt

cost_estimate_gpu_hours:   # hardware-explicit (defect #15); at the REVISED 25B budget
  # cycle 4 defect #17: includes the 8 refinement loops (deep supervision at
  # every segment => compute scales with loop count; activation memory does not)
  at_25B_tokens:
    a100_bf16: 78
    h100_fp8: 12
  at_323B_tokens_for_reference:
    a100_bf16: 1011
  # The token-budget cut (12.9x) dominates any precision lever (FP8 1.6x),
  # and costs no accuracy because the dropped tokens are redundant.

# ---- hyperparameters that were MISSING entirely (cycle 5, B1) ----
# Not invented. Each states the procedure that fixes it, and the 5B checkpoint
# (~1.5% of the run) is cheap enough that these are sweeps, not guesses.
optimization:
  global_batch_tokens: 524288      # 0.5M tokens/step -> ~48k steps at 25B
  # derived, not chosen: 25e9 / 524288 = 47,684 steps
  learning_rate:
    muon_2d:  {value: null, fix_by: "LR sweep at 5B; Moonlight publishes a Muon schedule"}
    adamw_1d: {value: null, fix_by: "same sweep; embeddings/norms/router"}
    status: PROVISIONAL
  warmup_steps: {value: 2000, note: "~4% of 48k steps", status: PROVISIONAL}
  schedule: cosine_to_10pct

loss_weights:                      # lambda_1..lambda_5 were never specified
  status: PROVISIONAL
  method: >
    Normalise every auxiliary loss to unit scale at initialisation, then tune on
    the 5B checkpoint. Do NOT hand-pick: the terms have different units
    (nats/step for stiffness, BCE for occupancy, Angstrom for distance).
  terms: [stiff, mg, elec, violation, flex]
  block_occupancy:
    pos_weight: "neg/pos, computed per example"   # implemented + tested
    note: "occupancy ~1.34% positive; a missed block is unrecoverable"

data_split:                        # was only in the catalogue, not in any config
  rule: "md5(header) % 100 < 80 train, 80-90 val, 90-100 test"
  source: data/catalog/splits/pretrain_split.json
  structure_dedup: "sequence-identity dedup MANDATORY (5S rRNA is 5,976 clusters)"
